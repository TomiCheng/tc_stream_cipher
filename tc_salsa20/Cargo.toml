[package]
name = "tc_salsa20"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Salsa20 and XSalsa20 stream ciphers, with portable and RustCrypto engines."
readme = "README.md"
documentation = "https://docs.rs/tc_salsa20"
keywords = ["salsa20", "xsalsa20", "stream-cipher", "cryptography", "no-std"]
categories = ["cryptography", "no-std"]
include = ["src/**", "tests/**", "benches/**", "README.md", "BENCHES.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
rustcrypto = ["dep:salsa20", "dep:cipher", "salsa20/zeroize"]

[dependencies]
tc_stream_cipher = { version = "0.1.0", path = "../tc_stream_cipher" }
tc_zeroize = "0.1.0"
salsa20 = { version = "0.11", optional = true }
# Not used directly: its `zeroize` feature wipes the keystream bytes that
# salsa20's stream wrapper buffers, which `salsa20/zeroize` alone leaves.
cipher = { version = "0.5", optional = true, features = ["zeroize"] }

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "salsa20"
harness = false
