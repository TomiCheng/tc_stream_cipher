[package]
name = "tc_rc4_family"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "RC4 and its descendants VMPC and ISAAC as stream ciphers, with portable and RustCrypto RC4 engines, kept for legacy interoperability."
readme = "README.md"
documentation = "https://docs.rs/tc_rc4_family"
keywords = ["rc4", "vmpc", "isaac", "stream-cipher", "no-std"]
categories = ["cryptography", "no-std"]
include = ["src/**", "tests/**", "benches/**", "README.md", "BENCHES.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
rustcrypto = ["dep:rc4", "rc4/zeroize"]

[dependencies]
tc_stream_cipher = { version = "0.1.0", path = "../tc_stream_cipher" }
tc_zeroize = "0.1.0"
rc4 = { version = "0.2", optional = true }

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "rc4"
harness = false
