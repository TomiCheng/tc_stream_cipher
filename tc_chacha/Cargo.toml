[package]
name = "tc_chacha"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ChaCha, IETF ChaCha20 (RFC 8439) and XChaCha20 stream ciphers, with portable and RustCrypto engines."
readme = "README.md"
documentation = "https://docs.rs/tc_chacha"
keywords = ["chacha20", "xchacha20", "stream-cipher", "cryptography", "no-std"]
categories = ["cryptography", "no-std"]
include = ["src/**", "tests/**", "benches/**", "README.md", "BENCHES.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
rustcrypto = [
    "dep:chacha20",
    "dep:cipher",
    "chacha20/legacy",
    "chacha20/xchacha",
    "chacha20/zeroize",
]

[dependencies]
tc_stream_cipher = { version = "0.1.0", path = "../tc_stream_cipher" }
tc_zeroize = "0.1.0"
chacha20 = { version = "0.10", optional = true }
# Not used directly: its `zeroize` feature wipes the keystream bytes that
# chacha20's stream wrapper buffers, which `chacha20/zeroize` alone leaves.
cipher = { version = "0.5", optional = true, features = ["zeroize"] }

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "chacha"
harness = false
